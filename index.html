<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xhzyuri • Links</title>
    <meta property="og:title" content="xhzyuri • Links">
    <meta property="og:description" content="Gamer • Fortaleza, CE — Meus links e redes">
    <meta property="og:image" content="https://xhzgaming.github.io/links/public/og.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://xhzgaming.github.io/links/public/og.jpg">
    <meta property="x:game:image" content="https://xhzgaming.github.io/links/public/x-banner.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px; color: #e5e7eb; }
        .container { max-width: 420px; width: 100%; text-align: center; }
        .profile { margin-bottom: 36px; }
        .avatar { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; border: 3px solid #d946ef; box-shadow: 0 0 20px rgba(217, 70, 239, 0.5); margin: 0 auto 20px; display: block; background: #1a1a24; }
        .name { font-size: 26px; font-weight: 700; margin-bottom: 6px; color: #fff; }
        .bio { font-size: 15px; color: #9ca3af; line-height: 1.5; max-width: 320px; margin: 0 auto; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .link-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #111118; border: 1px solid #2a2a35; color: #f3f4f6; text-decoration: none; padding: 15px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; transition: all 0.2s ease; }
        .link-btn:hover { border-color: #d946ef; background: #1a1a24; box-shadow: 0 0 16px rgba(217, 70, 239, 0.25); transform: translateY(-1px); }
        .edit-btn { position: fixed; bottom: 24px; right: 24px; background: #d946ef; color: #fff; border: none; width: 56px; height: 56px; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(217, 70, 239, 0.4); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #111118; border: 1px solid #2a2a35; border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; padding: 24px; text-align: left; }
        .modal-content h2 { margin-bottom: 20px; color: #fff; font-size: 20px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin: 14px 0 6px; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a35; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; outline: none; }
        input:focus, textarea:focus { border-color: #d946ef; }
        .link-item { background: #0a0a0f; border: 1px solid #2a2a35; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .link-item input { margin-bottom: 8px; }
        .remove-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .add-btn, .save-btn { background: #d946ef; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        .close-btn { background: transparent; border: 1px solid #2a2a35; color: #9ca3af; padding: 10px; border-radius: 10px; width: 100%; margin-top: 8px; cursor: pointer; }
        .footer { margin-top: 36px; font-size: 12px; color: #4b5563; }
        #photoInput { display: none; }
        .photo-btn { background: #2a2a35; color: #fff; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 6px; cursor: pointer; font-size: 14px; }
        .login-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .login-modal.active { display: flex; }
        .login-box { background: #111118; padding: 30px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
        .login-box h3 { margin-bottom: 16px; color: #fff; }
        .login-box input { margin-bottom: 12px; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img id="avatar" class="avatar" src="" alt="Perfil" style="display:none;">
            <h1 class="name" id="displayName">xhzyuri</h1>
            <p class="bio" id="displayBio">Gamer • Fortaleza, CE</p>
        </div>
        <div class="links" id="linksContainer"></div>
        <div class="footer">xhzyuri</div>
    </div>

    <button class="edit-btn" onclick="tryOpenSettings()">⚙️</button>

    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h3>Acesso Admin</h3>
            <input type="password" id="passwordInput" placeholder="Senha">
            <button class="save-btn" onclick="checkPassword()">Entrar</button>
            <div class="error-msg" id="loginError">Senha incorreta</div>
            <button class="close-btn" style="margin-top:10px;" onclick="closeLogin()">Cancelar</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Personalizar</h2>
            <label>Foto de perfil</label>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
            <button class="photo-btn" onclick="document.getElementById('photoInput').click()">Escolher foto</button>
            <label>Nome</label>
            <input type="text" id="editName" placeholder="Seu nome">
            <label>Bio</label>
            <textarea id="editBio" rows="2" placeholder="Uma frase sobre você"></textarea>
            <label>Links</label>
            <div id="linksEditor"></div>
            <button class="add-btn" onclick="addLink()">+ Adicionar link</button>
            <button class="save-btn" onclick="saveChanges()">Salvar</button>
            <button class="close-btn" onclick="closeModal()">Fechar</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "xhzyuri123"; // Mude essa senha se quiser
        const defaultData = { name: "xhzyuri", bio: "Gamer • Fortaleza, CE", photo: "", links: [ { title: "TikTok", url: "https://tiktok.com/", icon: "🎵" }, { title: "Twitch", url: "https://twitch.tv/", icon: "🎮" } ] };
        let memoryData = null;
        let isAuthenticated = sessionStorage.getItem('adminAuth') === 'true';

        function loadData() { if (memoryData) return memoryData; try { const saved = localStorage.getItem('xhzyuriLinks'); return saved ? JSON.parse(saved) : defaultData; } catch (e) { return defaultData; } }
        function saveData(data) { memoryData = data; try { localStorage.setItem('xhzyuriLinks', JSON.stringify(data)); } catch (e) {} }

        function render() {
            const data = loadData();
            document.getElementById('displayName').textContent = data.name;
            document.getElementById('displayBio').innerHTML = data.bio.replace(/\n/g, '<br>');
            const avatar = document.getElementById('avatar');
            if (data.photo) {
                avatar.src = data.photo;
                avatar.style.display = 'block';
            } else {
                avatar.style.display = 'none';
            }
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            data.links.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'link-btn';
                a.innerHTML = '<span class="icon">' + (link.icon || '🔗') + '</span> ' + link.title;
                container.appendChild(a);
            });
        }

        function tryOpenSettings() {
            if (isAuthenticated) {
                openModal();
            } else {
                document.getElementById('loginModal').classList.add('active');
                document.getElementById('passwordInput').focus();
                document.getElementById('loginError').style.display = 'none';
            }
        }

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === ADMIN_PASSWORD) {
                isAuthenticated = true;
                sessionStorage.setItem('adminAuth', 'true');
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('passwordInput').value = '';
                openModal();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }

        function closeLogin() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
        }

        function handlePhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = loadData();
                data.photo = e.target.result;
                saveData(data);
                render();
            };
            reader.readAsDataURL(file);
        }

        function openModal() {
            const data = loadData();
            document.getElementById('editName').value = data.name;
            document.getElementById('editBio').value = data.bio;
            const editor = document.getElementById('linksEditor');
            editor.innerHTML = '';
            data.links.forEach((link, i) => {
                const div = document.createElement('div');
                div.className = 'link-item';
                div.innerHTML = '<input type="text" placeholder="Emoji" value="' + (link.icon || '🔗') + '" data-field="icon" style="width:60px;display:inline-block;margin-right:8px;"><input type="text" placeholder="Título" value="' + link.title + '" data-field="title"><input type="url" placeholder="URL (https://...)" value="' + link.url + '" data-field="url"><button class="remove-btn" onclick="removeLink(' + i + ')">Remover</button>';
                editor.appendChild(div);
            });
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function addLink() { const data = loadData(); data.links.push({ title: "Novo link", url: "https://", icon: "🔗" }); saveData(data); openModal(); }

        function removeLink(index) { const data = loadData(); data.links.splice(index, 1); saveData(data); openModal(); }

        function saveChanges() {
            const data = loadData();
            data.name = document.getElementById('editName').value || "xhzyuri";
            data.bio = document.getElementById('editBio').value || "";
            const items = document.querySelectorAll('.link-item');
            data.links = [];
            items.forEach(item => {
                const icon = item.querySelector('[data-field="icon"]').value;
                const title = item.querySelector('[data-field="title"]').value;
                const url = item.querySelector('[data-field="url"]').value;
                if (title && url) data.links.push({ icon, title, url });
            });
            saveData(data);
            closeModal();
            render();
        }

        // Enter key on password
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('passwordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkPassword();
            });
        });

        render();
    </script>
</body>
</html>
